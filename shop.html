<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Crunch</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">🍟 Crunch.</div>
            <ul class="nav-links">
                <li><a href="home.html">🏠 Home</a></li>
                <li><a href="shop.html">🛍️ Shop</a></li>
                <li><a href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a></li>
                <li><a href="login.html" id="authLink">👤 Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="shop-container">
        <aside class="filters">
            <h3>Filters</h3>
            <div class="filter-group">
                <h4>Flavor</h4>
                <label><input type="checkbox" value="spicy"> Spicy</label>
                <label><input type="checkbox" value="salty"> Salty</label>
                <label><input type="checkbox" value="bbq"> BBQ</label>
                <label><input type="checkbox" value="cheese"> Cheese</label>
            </div>
            <div class="filter-group">
                <h4>Brand</h4>
                <label><input type="checkbox" value="lays"> Lay's</label>
                <label><input type="checkbox" value="doritos"> Doritos</label>
                <label><input type="checkbox" value="pringles"> Pringles</label>
            </div>
            <div class="filter-group">
                <h4>Price</h4>
                <input type="range" min="0" max="50" value="25" id="priceRange">
                <span id="priceValue">$25</span>
            </div>
            <button onclick="applyFilters()">Apply Filters</button>
        </aside>

        <main class="products-section">
            <h1>All Products</h1>
            <div class="product-grid" id="allProducts"></div>
        </main>
    </div>

    <footer>
        <p>&copy; 2024 Crunch. All rights reserved.</p>
    </footer>

    <script src="js/xml-handler.js"></script>
    <script src="js/main.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
