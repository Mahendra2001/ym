<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Crunch</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }
        .register-box {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s;
            box-sizing: border-box;
            background: white;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .register-btn {
            width: 100%;
            padding: 1rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .register-btn:hover {
            background: #764ba2;
        }
        .register-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }
        .register-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Crunch</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" id="authLink">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <h1>📝 Create Account</h1>
                <p>Join Crunch and get 10% off your first order!</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label>📱 Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="Enter your phone" required>
                </div>
                
                <div class="form-group">
                    <label>🏠 Address</label>
                    <input type="text" id="regAddress" placeholder="Enter your address" required>
                </div>
                
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                </div>
                
                <div class="form-group">
                    <label>🔒 Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="register-btn">✨ Create Account</button>
                
                <div class="register-footer">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
                
                <div class="register-footer">
                    <a href="index.html">← Back to Home</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
