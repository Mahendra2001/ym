<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khandeshi Crunch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <img src="images/logo.png" alt="Logo" class="logo">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">
            <button onclick="searchProducts()">🔍</button>
        </div>
        <h1>Khandeshi Crunch </h1>
        <p>Homemade Banana Chips • Freshly Packed • No Chemicals</p>
    </header>

    <section class="products-section">
        <h2 class="products-title">Products</h2>

        <div class="products-container">
            <button class="scroll-btn left" onclick="scrollProducts(-1)">‹</button>

            <div class="products-grid">

                <div class="product-card blue">
                    <img src="images/chips1.jpg" alt="Classic Banana Chips">
                    <h3>Classic Chips</h3>
                    <p><span class="old">₹150</span> <span class="new">₹120</span></p>
                </div>

                <div class="product-card red">
                    <img src="images/chips2.jpg" alt="Spicy Banana Chips">
                    <h3>Spicy Chips</h3>
                    <p><span class="old">₹150</span> <span class="new">₹120</span></p>
                </div>

                <div class="product-card yellow">
                    <img src="images/chips3.jpg" alt="Thin Cut Chips">
                    <h3>Thin Cut</h3>
                    <p><span class="old">₹150</span> <span class="new">₹120</span></p>
                </div>

                <div class="product-card green">
                    <img src="images/chips4.jpg" alt="Premium Banana Chips">
                    <h3>Premium</h3>
                    <p><span class="old">₹150</span> <span class="new">₹120</span></p>
                </div>

                <div class="product-card purple">
                    <img src="images/chips5.jpg" alt="Sweet Banana Chips">
                    <h3>Sweet Chips</h3>
                    <p><span class="old">₹150</span> <span class="new">₹120</span></p>
                </div>

                <div class="product-card orange">
                    <img src="images/chips6.jpg" alt="Crispy Banana Chips">
                    <h3>Crispy Chips</h3>
                    <p><span class="old">₹150</span> <span class="new">₹120</span></p>
                </div>

            </div>

            <button class="scroll-btn right" onclick="scrollProducts(1)">›</button>
        </div>
    </section>

    <section class="social-section">
        <h2>Follow Us on Social Media</h2>
        <div class="social-grid">
            <div class="social-item">
                <img src="images/social1.jpg" alt="Social Post 1">
            </div>
            <div class="social-item">
                <img src="images/social2.jpg" alt="Social Post 2">
            </div>
            <div class="social-item video-item">
                <video controls>
                    <source src="images/video.mp4" type="video/mp4">
                </video>
            </div>
            <div class="social-item">
                <img src="images/social3.jpg" alt="Social Post 3">
            </div>
            <div class="social-item">
                <img src="images/social4.jpg" alt="Social Post 4">
            </div>
        </div>
        <div class="social-icons">
            <a href="#">👍 Facebook</a>
            <a href="#">📸 Instagram</a>
            <a href="#">🐦 Twitter</a>
            <a href="#">▶️ YouTube</a>
        </div>
    </section>

</body>

<script>
    function scrollProducts(direction) {
        const grid = document.querySelector('.products-grid');
        const scrollAmount = 300;
        grid.scrollBy({
            left: direction * scrollAmount,
            behavior: 'smooth'
        });
    }

    function searchProducts() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.product-card');
        
        cards.forEach(card => {
            const title = card.querySelector('h3').textContent.toLowerCase();
            if (title.includes(input)) {
                card.style.display = 'block';
                card.style.transform = 'scale(1.3)';
                card.style.zIndex = '10';
            } else {
                card.style.display = input === '' ? 'block' : 'none';
                card.style.transform = 'scale(1)';
                card.style.zIndex = '1';
            }
        });
    }

    let socialIndex = 0;
    const socialItems = document.querySelectorAll('.social-item');
    
    function rotateSocial() {
        socialItems.forEach((item, index) => {
            item.classList.remove('active');
        });
        socialItems[socialIndex].classList.add('active');
        if (socialIndex + 1 < socialItems.length) {
            socialItems[socialIndex + 1].classList.add('active');
        }
        socialIndex = (socialIndex + 1) % socialItems.length;
    }
    
    rotateSocial();
    setInterval(rotateSocial, 5000);
</script>

</html>
