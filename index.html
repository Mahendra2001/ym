<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khandeshi Crunch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <h1>Khandeshi Crunch </h1>
  <p>Homemade Banana Chips • Freshly Packed • No Chemicals</p>
</header>

<section class="products-section">
  <h2 class="products-title">Products</h2>

  <div class="products-grid">

    <div class="product-card blue">
      <img src="images/chips1.png" alt="Classic Banana Chips">
      <h3>Classic Chips</h3>
      <p><span class="old">₹150</span> <span class="new">₹120</span></p>
    </div>

    <div class="product-card red">
      <img src="images/chips2.png" alt="Spicy Banana Chips">
      <h3>Spicy Chips</h3>
      <p><span class="old">₹150</span> <span class="new">₹120</span></p>
    </div>

    <div class="product-card yellow">
      <img src="images/chips3.png" alt="Thin Cut Chips">
      <h3>Thin Cut</h3>
      <p><span class="old">₹150</span> <span class="new">₹120</span></p>
    </div>

    <div class="product-card green">
      <img src="images/chips4.png" alt="Premium Banana Chips">
      <h3>Premium</h3>
      <p><span class="old">₹150</span> <span class="new">₹120</span></p>
    </div>

  </div>
</section>

</body>
</html>
